name: Sync upstream translations

# 定时去看上游有没有发新 Release。
# 有的话：拉新源码 → 全量扫描界面文案 → 与现有语言包做差集 →
#         术语表优先 + LLM 兜底补译 → 校验 → 提交 → 发一个语言包 Release。
#
# 注意：本仓库**不编译**任何东西，也不产出 DMG。
# 外挂语言包方案不需要编译 —— 上游一旦改动源码，
# 只有「先赋给 String 变量、再传给视图」那类文案是语言包碰不到的，
# 而这部分本来就得改源码，不在本仓库的能力范围内（详见 README 的已知限制）。
#
# 判定「有没有新增的菜单项/提示文案」的做法：
#   不比对菜单本身，而是把新版本源码里所有「人可读的字面量」全量抽出来
#   （extract_strings.py），与现有语言包做差集。这样上游无论是新增菜单项、
#   改了提示文案，还是把硬编码字符串挪进了新组件，都跑不掉。

on:
  schedule:
    # 每 6 小时一次。GitHub 的定时任务在高峰期可能延迟几分钟到十几分钟。
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "即使上游版本没变，也重跑一遍扫描与翻译"
        type: boolean
        default: false
      tag:
        description: "指定上游 tag（留空 = 用最新 Release）"
        type: string
        default: ""

permissions:
  # 需要写仓库内容（提交语言包 / state）和创建 Release。
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------ 1. 仓库地址
      # fork 之后不用改任何文件：这里先把 __REPO__ 换成「本次运行的真实仓库」，
      # 这样语言包 zip、一键脚本里的下载地址都会自动指向 fork 自己的仓库。
      - name: 统一仓库地址
        env:
          CI: "1"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/set-repo.sh "$REPO"

      # ------------------------------------------------------------ 2. 上游版本
      - name: 查询上游最新 Release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # 注意：下面几处「赋值 + 可能失败的命令」都必须显式兜底。
          # set -o pipefail 之后，命令替换失败会让整个赋值语句失败，
          # set -e 随即终止这一步 —— 日志里只剩一条 gh 的原始报错，很难判断原因。
          STATE=state/upstream.json
          if [ ! -f "$STATE" ]; then
            echo "❗ 找不到 ${STATE}，无法确定上游仓库与已知版本。" >&2
            exit 1
          fi
          UPSTREAM_REPO="$(python3 -c "import json;print(json.load(open('$STATE'))['upstream']['repo'])")"
          echo "upstream_repo=$UPSTREAM_REPO" >> "$GITHUB_ENV"

          WANT="${INPUT_TAG:-}"
          if [ -n "$WANT" ]; then
            TAG="$WANT"
            PUBLISHED="$(gh api "repos/$UPSTREAM_REPO/releases/tags/$TAG" --jq .published_at 2>/dev/null || true)"
          else
            if ! JSON="$(gh api "repos/$UPSTREAM_REPO/releases/latest")"; then
              echo "❗ 取不到 $UPSTREAM_REPO 的最新 Release（可能它还没发过 Release，或 token 权限不足）。" >&2
              exit 1
            fi
            TAG="$(printf '%s' "$JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')"
            PUBLISHED="$(printf '%s' "$JSON" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("published_at") or "")')"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

          KNOWN="$(python3 -c "import json;print(json.load(open('$STATE')).get('upstream',{}).get('latest_tag',''))")"

          # 本仓库是否已经发过语言包 Release（tag 形如 lang-v1.4.6）
          HAS_RELEASE=false
          if gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | grep -q '^lang-v'; then
            HAS_RELEASE=true
          fi

          NEED=false
          REASON=""
          if [ -n "$WANT" ]; then
            NEED=true;  REASON="手动指定了上游 tag ${TAG}"
          elif [ "$TAG" != "$KNOWN" ]; then
            NEED=true;  REASON="上游发新版本：${KNOWN:-（未知）} -> ${TAG}"
          elif [ "$HAS_RELEASE" = false ]; then
            NEED=true;  REASON="本仓库还没发过语言包 Release"
          fi

          echo "needs_sync=$NEED" >> "$GITHUB_OUTPUT"
          if [ "$NEED" = true ]; then
            echo "==> 需要同步：$REASON"
          else
            echo "==> 上游仍是最新的 ${TAG}，且已发过对应语言包，跳过。"
          fi

      # ------------------------------------------------------------ 3. 取源码
      - name: 拉取上游源码
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/fetch-upstream.sh "$TAG" --dest _upstream

      # ------------------------------------------------------------ 4. 扫新词条
      - name: 扫描界面文案（与现有语言包做差集）
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          python3 scripts/tools/extract_strings.py _upstream zh-Hans.lproj/Localizable.strings

      # 上面那个是全量口径（分母里混着 PSD 常量之类的噪音）。
      # 这一步只统计「真正的本地化位置」，回答「外挂语言包能翻多少」，
      # 并顺带给出「必须先改源码才能翻」的规模 —— README 里的数字来自这里。
      - name: 分析外挂方案的覆盖上限
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          python3 scripts/tools/analyze_coverage.py _upstream \
            --pack zh-Hans.lproj/Localizable.strings \
            --json build/coverage.json

      # ------------------------------------------------------------ 5. 补译文
      - name: 术语表优先 + LLM 兜底补译文
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          # 没配 LLM_API_KEY 也能跑：术语表命中的照补，其余进 state/pending/ 等人看
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL:    ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
        run: |
          set -euo pipefail
          python3 scripts/tools/translate_missing.py

      - name: 合并译文进语言包
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          ARGS="translations/curated.tsv"
          if [ -s translations/auto.tsv ]; then ARGS="$ARGS translations/auto.tsv"; fi
          # shellcheck disable=SC2086
          python3 scripts/tools/merge_translations.py $ARGS

      - name: 校验语言包
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          python3 scripts/tools/check-strings.py

      # ------------------------------------------------------------ 6. 更新状态
      - name: 更新 state/upstream.json
        id: state
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
          PUBLISHED: ${{ steps.upstream.outputs.published }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${FORCE:-false}" = "true" ]; then ARGS="--force"; fi
          python3 scripts/tools/update_state.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --published "$PUBLISHED" \
            --repo "$REPO" \
            --release-tag "lang-v${VERSION}" \
            --github-output "$GITHUB_OUTPUT" \
            $ARGS

      # ------------------------------------------------------------ 7. 组装发布物
      - name: 组装发布物（语言包 zip + 两个一键脚本）
        id: pack
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/make-langpack.sh "$VERSION" dist
          # 一键脚本在第一步已经换成真实仓库地址，直接作为附件分发
          cp -f "一键安装语言包.command" "一键还原官方版.command" dist/
          chmod +x dist/*.command
          ZIP="Compositor-zh-Hans-语言包-v${VERSION}.zip"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          python3 scripts/tools/make_release_notes.py \
            --repo "$REPO" --version "$VERSION" --zip-name "$ZIP" \
            > dist/RELEASE_NOTES.md
          echo "--- dist ---"
          ls -lh dist/

      # ------------------------------------------------------------ 8. 提交
      - name: 有变化就提交
        id: diff
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "compositor-zh-bot"
          git config user.email "actions@users.noreply.github.com"

          git status --short

          if git diff --quiet && git diff --cached --quiet && \
             [ -z "$(git ls-files --others --exclude-standard -- translations state)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本轮没有产生改动（语言包内容未变），仍会更新 Release 说明。"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git add zh-Hans.lproj translations state appcast.xml
          git commit -m "sync: 跟随上游 ${TAG}（${VERSION}）更新语言包" \
            -m "自动同步：扫描上游 ${TAG} 源码 -> 术语表优先 + LLM 兜底补译 -> 校验通过。" \
            -m "详见 state/upstream.json 与 state/pending/。" || echo "没有可提交内容。"
          git push

      # ------------------------------------------------------------ 9. 发 Release
      # 只发语言包，不编译、不出 DMG。
      # tag 用 lang-v<上游版本>，与上游的 v<版本> 区分开，避免撞车。
      - name: 发布语言包 Release
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          UP_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="lang-v${VERSION}"
          TITLE="简体中文语言包 v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "==> Release $TAG 已存在，更新说明与附件"
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$TAG" dist/*.zip dist/*.command --clobber
          else
            echo "==> 创建 Release $TAG"
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file dist/RELEASE_NOTES.md \
              --latest \
              dist/*.zip dist/*.command
          fi

          echo "--- 现在的 Release ---"
          gh release list --limit 5

      - name: 上传构建产物（便于排查）
        if: always() && (steps.upstream.outputs.needs_sync == 'true' || inputs.force)
        uses: actions/upload-artifact@v4
        with:
          name: 语言包-v${{ steps.upstream.outputs.version }}
          path: |
            dist/*.zip
            dist/*.command
            dist/RELEASE_NOTES.md
            state/pending/untranslated.tsv
          if-no-files-found: ignore
          retention-days: 30

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 上游同步结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 上游版本 | ${{ steps.upstream.outputs.tag }} |"
            echo "| 需要同步 | ${{ steps.upstream.outputs.needs_sync }} |"
            echo "| 语言包词条 | ${{ steps.state.outputs.total }} 条 |"
            echo "| 覆盖率 | ${{ steps.state.outputs.pct }}%（${{ steps.state.outputs.covered }}/${{ steps.state.outputs.found }}） |"
            echo "| 语言包有改动 | ${{ steps.diff.outputs.changed }} |"
            echo ""
            echo "待人工处理的词条在 \`state/pending/untranslated.tsv\`。"
          } >> "$GITHUB_STEP_SUMMARY"
