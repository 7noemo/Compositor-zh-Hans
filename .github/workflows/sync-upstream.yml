name: Sync upstream translations

# 定时去看上游有没有发新 Release。
# 有的话：
#   拉新源码 → 分析 A/B 类 → 自动维护提示表 → 全量扫描并筛出 A 类新文案 →
#   术语表优先 + LLM 兜底补译 → 合并 → 校验 → 清理孤儿 key →
#   核对 → 提交 → 发一个语言包 Release。
#
# 注意：本仓库**不编译**任何东西，也不产出 DMG。
# 外挂语言包方案不需要编译 —— 上游一旦改动源码，
# 只有「先赋给 String 变量、再传给视图」那类文案是语言包碰不到的，
# 而这部分本来就得改源码，不在本仓库的能力范围内（详见 README 的已知限制）。
#
# 判定「有没有新增的菜单项/提示文案」的做法：
#   不比对菜单本身，而是把新版本源码里所有「人可读的字面量」全量抽出来
#   （extract_strings.py），与现有语言包做差集。这样上游无论是新增菜单项、
#   改了提示文案，还是把硬编码字符串挪进了新组件，都跑不掉。
#
# 「核对 A 类文案的 key」是最后一道校验（不拦截）：
#   SwiftUI 查表用的 key 由源码写法在编译期决定（"Close \(x)" -> "Close %@"，
#   且**永远不带序号**）。所以光有译文不够，key 必须逐字符对上。
#
#   ⚠️ 2026-10-10 用户拍板：**取消人工确认**。
#   —— 能翻的自动翻，翻不了的**直接跳过**：不写待办文件、不开 Issue、不等人。
#   以前是「有缺口就退出码 1」→ 不提交、不发布、state 不推进，6 小时后再跑
#   条件一模一样，于是「上游加一条新文案」就让整条流水线永久卡死等人来修
#   （实测连续红了 4 次）；后来改成「记账 + 开 Issue 等人看」，那只是把
#   「每轮必须有人看一眼」换了个形式，尾巴还在。
#   现在缺口只写进 build/gaps.json（**不入库**）并在下面汇总里报个数字 ——
#   纯粹是透明度，不是让人来认领。想按老规矩严格拦截：本地跑
#   check-coverage-gap.py --strict（CI 不用这个模式）。
#
# 另外三件以前要人工做、现在自动做的事：
#   * 提示表失效（上游改文案 ⇒ 按原文索引对不上）→ sync_hints.py 迁移/剪枝
#   * 上游删改名留下的孤儿 key           → prune_obsolete.py 对比快照清理
#   * 新插值文案的格式符                → 全候选写进语言包，与类型无关

on:
  schedule:
    # 每 6 小时一次。GitHub 的定时任务在高峰期可能延迟几分钟到十几分钟。
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "即使上游版本没变，也重跑一遍扫描与翻译"
        type: boolean
        default: false
      tag:
        description: "指定上游 tag（留空 = 用最新 Release）"
        type: string
        default: ""

permissions:
  # 需要写仓库内容（提交语言包 / state / 提示表）和创建 Release。
  # 刻意**不要** issues: write —— 本项目不靠 Issue 记待办（见文件头「取消人工确认」）。
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------ 1. 仓库地址
      # fork 之后不用改任何文件：这里先把 __REPO__ 换成「本次运行的真实仓库」，
      # 这样语言包 zip、一键脚本里的下载地址都会自动指向 fork 自己的仓库。
      - name: 统一仓库地址
        env:
          CI: "1"
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/set-repo.sh "$REPO"

      # ------------------------------------------------------------ 2. 上游版本
      - name: 查询上游最新 Release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # 注意：下面几处「赋值 + 可能失败的命令」都必须显式兜底。
          # set -o pipefail 之后，命令替换失败会让整个赋值语句失败，
          # set -e 随即终止这一步 —— 日志里只剩一条 gh 的原始报错，很难判断原因。
          STATE=state/upstream.json
          if [ ! -f "$STATE" ]; then
            echo "❗ 找不到 ${STATE}，无法确定上游仓库与已知版本。" >&2
            exit 1
          fi
          UPSTREAM_REPO="$(python3 -c "import json;print(json.load(open('$STATE'))['upstream']['repo'])")"
          echo "upstream_repo=$UPSTREAM_REPO" >> "$GITHUB_ENV"

          WANT="${INPUT_TAG:-}"
          if [ -n "$WANT" ]; then
            TAG="$WANT"
            PUBLISHED="$(gh api "repos/$UPSTREAM_REPO/releases/tags/$TAG" --jq .published_at 2>/dev/null || true)"
          else
            if ! JSON="$(gh api "repos/$UPSTREAM_REPO/releases/latest")"; then
              echo "❗ 取不到 $UPSTREAM_REPO 的最新 Release（可能它还没发过 Release，或 token 权限不足）。" >&2
              exit 1
            fi
            TAG="$(printf '%s' "$JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')"
            PUBLISHED="$(printf '%s' "$JSON" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("published_at") or "")')"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

          KNOWN="$(python3 -c "import json;print(json.load(open('$STATE')).get('upstream',{}).get('latest_tag',''))")"

          # 本仓库是否已经发过语言包 Release（tag 形如 lang-v1.4.6）
          HAS_RELEASE=false
          if gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | grep -q '^lang-v'; then
            HAS_RELEASE=true
          fi

          NEED=false
          REASON=""
          if [ -n "$WANT" ]; then
            NEED=true;  REASON="手动指定了上游 tag ${TAG}"
          elif [ "$TAG" != "$KNOWN" ]; then
            NEED=true;  REASON="上游发新版本：${KNOWN:-（未知）} -> ${TAG}"
          elif [ "$HAS_RELEASE" = false ]; then
            NEED=true;  REASON="本仓库还没发过语言包 Release"
          fi

          echo "needs_sync=$NEED" >> "$GITHUB_OUTPUT"
          if [ "$NEED" = true ]; then
            echo "==> 需要同步：$REASON"
          else
            echo "==> 上游仍是最新的 ${TAG}，且已发过对应语言包，跳过。"
          fi

      # ------------------------------------------------------------ 3. 取源码
      - name: 拉取上游源码
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/fetch-upstream.sh "$TAG" --dest _upstream

      # ------------------------------------------------------------ 4. 分析现状
      # 这一步跑在「同步提示表」之前，是有意为之：它顺便产出 translatable_keys
      # （本轮扫到的 A 类文案原文全量清单），那是 sync_hints.py 判断提示表
      # 哪些条目失效、哪些新文案还没登记的唯一输入。
      # 这里用的还是**上一轮的**提示表，所以 key_variants() 对没登记的文案会退回
      # 「猜」；猜出来的是多候选超集，不会漏，只会多 —— 无妨。
      # 真正对外报数的口径是后面「精确核对」那一步重算的。
      - name: 分析外挂方案的覆盖上限
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          python3 scripts/tools/analyze_coverage.py _upstream \
            --pack zh-Hans.lproj/Localizable.strings \
            --json build/coverage.json

      # ------------------------------------------------------------ 5. 维护提示表
      # 上游改一句文案，提示表里按原文索引的那条就对不上了。
      # 以前 check-coverage-gap.py 把「对不上」判成失败，而**流水线里根本没有
      # 任何步骤会去更新这个文件** —— 于是上游改一句话 ⇒ 永久红，
      # 每次都卡在这里、每次都要人工 grep 源码改 JSON。
      # 现在交给工具：能迁移的迁移（保住「这个插值是 String」这类已核实的事实），
      # 迁移不了的就是真报废，剪掉。
      - name: 自动同步插值格式符提示表
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/tools/sync_hints.py build/coverage.json --version "$VERSION"

      # ------------------------------------------------------------ 6. 扫新词条
      # 放在提示表同步之后：这样待译清单里的插值 key 形式是准的。
      - name: 扫描界面文案（与现有语言包做差集）
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          python3 scripts/tools/extract_strings.py _upstream zh-Hans.lproj/Localizable.strings

      # ------------------------------------------------------------ 7. 补译文
      - name: 术语表优先 + LLM 兜底补译文
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          # 没配 LLM_API_KEY 也能跑：术语表命中的照补，其余**直接跳过**
          # （2026-10-10 起不再写待办清单、也不再开 Issue 等人看）。
          # 配了就会全自动补掉新文案 —— 这是「有新文案也不用管」的关键一步。
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL:    ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
        run: |
          set -euo pipefail
          python3 scripts/tools/translate_missing.py

      - name: 合并译文进语言包
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          ARGS="translations/curated.tsv"
          if [ -s translations/auto.tsv ]; then ARGS="$ARGS translations/auto.tsv"; fi
          # shellcheck disable=SC2086
          python3 scripts/tools/merge_translations.py $ARGS

      - name: 校验语言包
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          python3 scripts/tools/check-strings.py

      # ------------------------------------------------------------ 8. 清理孤儿 key
      # merge_translations.py 只加不改不删 —— 上游每改一次文案，旧 key 就永久
      # 留在语言包里（v1.4.7 那 4 条、v1.4.9 这 5 条都是孤儿，以前靠手工比对删）。
      # 这里按「上一轮快照 vs 本轮扫描」算出上游已不再查的 key 并摘掉。
      # 工具自带安全阀：一次要删超过 40 条就中止报错（那多半是扫描出了问题，
      # 不是上游真的一次删掉这么多文案），宁可红一次让人看一眼。
      - name: 清理上游已删除的失效 key
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/tools/prune_obsolete.py build/coverage.json --tag "$TAG"

      # 核对：A 类文案按 SwiftUI 运行时规则算出的 key，是否在语言包里逐字符存在。
      # 早先用「骨架匹配」（只看占位符位置）会把格式符类型或序号写错的条目也
      # 判成已覆盖 —— 那正是「明明有译文却还显示英文」的根因。
      #
      # ⚠️ 这一步**不阻断流水线**，也**不记待办**（check-coverage-gap.py 默认行为）：
      # 没译上的文案只写进 build/gaps.json（build/ 不入库），并在日志与下面汇总里
      # 报个条数。不开 Issue、不写 state/pending/、不等人来认领。
      # 这是 2026-10-10 用户拍板的「能翻译就翻译，翻译不了就不翻译」。
      # 本地想按老规矩严格拦截：手动跑 check-coverage-gap.py --strict。
      - name: 核对 A 类文案的 key（不拦截、不记待办）
        id: gapcheck
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        run: |
          set -euo pipefail
          # 重算一遍：上面那份 coverage.json 是**补译文/清孤儿之前**生成的，
          # 补完再看才准，否则会把已经补上的缺口又报一遍。
          python3 scripts/tools/analyze_coverage.py _upstream \
            --pack zh-Hans.lproj/Localizable.strings \
            --json build/coverage.json > /dev/null
          python3 scripts/tools/check-coverage-gap.py build/coverage.json \
            --gaps-out build/gaps.json
          # 把条数交给下面「汇总」那一步展示（纯透明，不代表要人处理）。
          # 赋值必须显式兜底：set -euo pipefail 下命令替换失败会让这一步直接死掉。
          GAPS="$(python3 -c "import json;print(json.load(open('build/gaps.json'))['missing_contentful'])" 2>/dev/null || true)"
          if [ -z "$GAPS" ]; then
            echo "⚠️ 读不到 build/gaps.json 里的缺口条数，按 0 记。"
            GAPS=0
          fi
          echo "gaps=$GAPS" >> "$GITHUB_OUTPUT"
          if [ "$GAPS" -eq 0 ]; then
            echo "✅ A 类文案本轮全部有译文。"
          else
            echo "ℹ️ ${GAPS} 条没译上，已跳过（界面上会显示英文，其余不受影响）。"
          fi

      # ------------------------------------------------------------ 6. 更新状态
      - name: 更新 state/upstream.json
        id: state
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
          PUBLISHED: ${{ steps.upstream.outputs.published }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${FORCE:-false}" = "true" ]; then ARGS="--force"; fi
          python3 scripts/tools/update_state.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --published "$PUBLISHED" \
            --repo "$REPO" \
            --release-tag "lang-v${VERSION}" \
            --github-output "$GITHUB_OUTPUT" \
            $ARGS

      # ------------------------------------------------------------ 7. 组装发布物
      - name: 组装发布物（语言包 zip + 两个一键脚本）
        id: pack
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/make-langpack.sh "$VERSION" dist

          # 一键脚本在第一步已经换成真实仓库地址，直接作为附件分发。
          #
          # 但附件名必须改成**纯 ASCII**：GitHub 会「重命名带特殊字符、
          # 非 ASCII 字符的附件名」（官方文档 REST API → releases → assets
          # 的 Notes 一节就是这么写的）。实测：
          #     ?name=中文名          → 静默改写成 default.command
          #     filename*=UTF-8''…    → 直接 400 "Invalid name for request"
          # 而且两个中文名改写后会同名，报 422 already_exists —— 之前 CI
          # 卡在「发布语言包 Release」那一步，就是这个原因，跟权限无关。
          # 中文名保留在仓库文件与 zip 内部，这里只改「分发用的名字」。
          cp -f "一键安装语言包.command" "dist/install-zh-Hans.command"
          cp -f "一键还原官方版.command" "dist/restore-official.command"
          chmod +x dist/*.command

          ZIP="Compositor-zh-Hans-langpack-v${VERSION}.zip"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

          # 顺带自证：dist/ 里所有文件名都必须是纯 ASCII，否则附件注定被改写。
          # 这里不用 grep -q：它提前关管道会让 ls 收 SIGPIPE，
          # 配上 pipefail 会把「有命中」误判成「没命中」。
          BAD_NAME="$(LC_ALL=C ls dist | LC_ALL=C grep '[^ -~]' || true)"
          if [ -n "$BAD_NAME" ]; then
            echo "❗ dist/ 里出现了非 ASCII 文件名，GitHub 一定会改写它们："
            printf '%s\n' "$BAD_NAME" | sed 's/^/     /'
            exit 1
          fi

          python3 scripts/tools/make_release_notes.py \
            --repo "$REPO" --version "$VERSION" --zip-name "$ZIP" \
            > dist/RELEASE_NOTES.md
          echo "--- dist ---"
          ls -lh dist/

      # ------------------------------------------------------------ 8. 提交
      - name: 有变化就提交
        id: diff
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "compositor-zh-bot"
          git config user.email "actions@users.noreply.github.com"

          git status --short

          if git diff --quiet && git diff --cached --quiet && \
             [ -z "$(git ls-files --others --exclude-standard -- translations state scripts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本轮没有产生改动（语言包内容未变），仍会更新 Release 说明。"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          # scripts 也要提交：提示表的自动迁移/剪枝改的是
          # scripts/tools/key-type-hints.json，漏了它下一轮又会「失效」。
          git add zh-Hans.lproj translations state appcast.xml scripts
          git commit -m "sync: 跟随上游 ${TAG}（${VERSION}）更新语言包" \
            -m "自动同步：扫描上游 ${TAG} 源码 -> 术语表优先 + LLM 兜底补译 -> 校验通过。" \
            -m "详见 state/upstream.json。" || echo "没有可提交内容。"
          git push

      # ------------------------------------------------------------ 9. 发 Release
      # 只发语言包，不编译、不出 DMG。
      # tag 用 lang-v<上游版本>，与上游的 v<版本> 区分开，避免撞车。
      #
      # 这一步刻意**不开 set -e**：gh 失败时得先把它的原始报错完整打出来，
      # 再决定退不退。之前直接 set -e，gh 的 stderr 被吞掉，日志里只剩一句
      # "Process completed with exit code 1"，完全看不出是权限、tag 冲突
      # 还是别的什么。
      - name: 发布语言包 Release
        if: steps.upstream.outputs.needs_sync == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.upstream.outputs.version }}
          UP_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -uo pipefail

          TAG="lang-v${VERSION}"
          TITLE="简体中文语言包 v${VERSION}"

          echo "==> 环境自检"
          echo "    gh   : $(gh --version 2>&1 | head -n 1)"
          echo "    repo : $REPO"
          echo "    tag  : ${TAG}（对应上游 ${UP_TAG}）"

          # token 到底能不能写？用一次轻量 API 调用问出来。
          # 这样万一真是权限问题，日志里会直接看到 push=false，
          # 而不是一句语焉不详的 "Resource not accessible by integration"。
          if PERM="$(gh api "repos/$REPO" --jq '.permissions' 2>&1)"; then
            echo "    token 权限: $PERM"
          else
            echo "    ⚠️ 取权限信息失败：$PERM"
          fi

          echo "==> 附件检查"
          ASSETS=()
          for f in dist/*.zip dist/*.command; do
            if [ -e "$f" ]; then
              printf '    %-46s %8s B\n' "$f" "$(wc -c <"$f" | tr -d ' ')"
              ASSETS+=("$f")
            else
              echo "    ❌ 缺附件：$f"
            fi
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "❗ dist/ 里一个附件都没有，请先看「组装发布物」那一步的日志。"
            exit 1
          fi

          echo "==> 创建 / 更新 Release"
          # 统一用 if OUT="$(cmd 2>&1)"; then RC=0; else RC=$?; fi 的写法：
          # 既能留住 gh 的原始输出，又能拿到真实退出码。
          # 直接写 `cmd || RC=$?` 会把输出漏到 stdout 而不受控，
          # 直接 set -e 又会把报错吞掉。
          RC=0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "    Release $TAG 已存在，更新标题、说明与附件"
            if OUT="$(gh release edit "$TAG" --title "$TITLE" \
                        --notes-file dist/RELEASE_NOTES.md 2>&1)"; then
              RC=0
            else
              RC=$?
            fi
            echo "$OUT"
            if [ "$RC" -eq 0 ]; then
              # --clobber：附件重名时直接覆盖，否则会 422
              if OUT="$(gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>&1)"; then
                RC=0
              else
                RC=$?
              fi
              echo "$OUT"
            fi
          else
            echo "    Release $TAG 不存在，新建"
            if OUT="$(gh release create "$TAG" --title "$TITLE" \
                        --notes-file dist/RELEASE_NOTES.md \
                        --latest "${ASSETS[@]}" 2>&1)"; then
              RC=0
            else
              RC=$?
            fi
            echo "$OUT"

            # --latest 只是给仓库侧栏挂个「最新」标记，不是必需品。
            # 万一它挑剔（比如仓库里还没有任何 Release 时的边界行为），
            # 去掉它再试一次，别为了一个展示性标记把整条流水线拖红。
            if [ "$RC" -ne 0 ]; then
              echo "    ⚠️ 带 --latest 的创建失败（退出码 ${RC}），去掉 --latest 重试…"
              if OUT="$(gh release create "$TAG" --title "$TITLE" \
                          --notes-file dist/RELEASE_NOTES.md \
                          "${ASSETS[@]}" 2>&1)"; then
                RC=0
              else
                RC=$?
              fi
              echo "$OUT"
            fi
          fi

          if [ "$RC" -ne 0 ]; then
            echo ""
            echo "❗ 发布失败（退出码 ${RC}）。上面那行才是 gh 的原始报错。"
            echo "   常见原因："
            echo "     1) 附件名/路径有问题：看上面「附件检查」有没有 ❌。"
            echo "        ⚠️ 附件名必须纯 ASCII —— GitHub 会重命名含非 ASCII 的"
            echo "           附件名，还会因此撞名报 422 ReleaseAsset.name already exists。"
            echo "     2) 仓库 Settings → Actions → General → Workflow permissions"
            echo "        还停在 Read-only。改成「Read and write」后重跑本 workflow。"
            echo "        （注意：若真是这个原因，前面「有变化就提交」那一步的 git push"
            echo "          也会失败 —— 它成功了就说明权限没问题。）"
            echo "     3) 已存在同名 tag/release 但指向别处：删掉后重跑。"
            exit "$RC"
          fi

          # 附件名核对：GitHub 会悄悄改写含特殊字符/非 ASCII 的附件名，
          # 而且**不报错**。用户下载到一个叫 default.command 的怪文件才发现就晚了，
          # 所以这里把「预期名」和「实际存下来的名」对一遍。
          echo ""
          echo "==> 核对附件名（确认没被 GitHub 改写）"
          WANT="$(for f in "${ASSETS[@]}"; do basename "$f"; done | LC_ALL=C sort)"
          GOT="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | LC_ALL=C sort || true)"
          if [ "$WANT" != "$GOT" ]; then
            echo "❗ 附件名与预期不一致 —— GitHub 改写过它们。"
            echo "   预期："
            printf '%s\n' "$WANT" | sed 's/^/     /'
            echo "   实际："
            printf '%s\n' "$GOT"  | sed 's/^/     /'
            echo "   修法：附件名必须纯 ASCII（含中文的会被改写成 default.xxx）。"
            exit 1
          fi
          echo "    ✅ 附件名均为纯 ASCII，与预期一致："
          printf '%s\n' "$GOT" | sed 's/^/       /'

          echo "--- 现在的 Release ---"
          gh release list --limit 5

      - name: 上传构建产物（便于排查）
        if: always() && (steps.upstream.outputs.needs_sync == 'true' || inputs.force)
        uses: actions/upload-artifact@v4
        with:
          name: 语言包-v${{ steps.upstream.outputs.version }}
          path: |
            dist/*.zip
            dist/*.command
            dist/RELEASE_NOTES.md
            build/gaps.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 上游同步结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 上游版本 | ${{ steps.upstream.outputs.tag }} |"
            echo "| 需要同步 | ${{ steps.upstream.outputs.needs_sync }} |"
            echo "| 语言包词条 | ${{ steps.state.outputs.total }} 条 |"
            echo "| 覆盖率 | ${{ steps.state.outputs.pct }}%（${{ steps.state.outputs.covered }}/${{ steps.state.outputs.found }}） |"
            echo "| 没译上的（已跳过） | ${{ steps.gapcheck.outputs.gaps }} 条 |"
            echo "| 语言包有改动 | ${{ steps.diff.outputs.changed }} |"
            echo ""
            echo "本轮已做的自动维护：同步插值格式符提示表、清理上游删掉的失效 key、"
            echo "术语表/LLM 补译。"
            echo ""
            echo "**能翻的已经自动翻好并发布；翻不了的直接跳过** —— 不写待办清单、"
            echo "不开 Issue、不需要人工确认（2026-10-10 起）。"
            echo "没译上的清单只在本次运行的构建产物 \`gaps.json\` 里，供排查用。"
          } >> "$GITHUB_STEP_SUMMARY"
