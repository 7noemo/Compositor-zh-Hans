name: Build & release macOS app

# 把打过本地化补丁的上游源码编译成「完整汉化版」DMG，发到本仓库的 Releases。
#
# 触发方式
#   * Sync upstream translations 跑完之后自动接力（最常用）
#   * 手动 workflow_dispatch
#   * 推送形如 v1.4.6-zh 的 tag
#
# 为什么不会自己触发自己：
#   本 workflow 最后用 `gh release create v<版本>-zh` 建 Release，这会顺带建出同名 tag。
#   GitHub 的既有规则是「由 GITHUB_TOKEN 产生的事件不会再起新的 workflow run」，
#   所以那个 tag 不会把 `on: push: tags` 这条再点一遍。（手动 push tag 才会。）
#
# 为什么不用 Developer ID 签名
#   Developer ID 证书 & Apple 公证都要付费账号，这里用 ad-hoc 签名。
#   代价是首次打开需要在「隐私与安全性」里放行一次，
#   一键安装脚本会自动清掉 com.apple.quarantine 来省掉这一步。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 tag（留空 = 用 state/upstream.json 记录的版本）"
        type: string
        default: ""
      skip_selfcheck:
        description: "跳过自检，直接编译（仅排障用）"
        type: boolean
        default: false
  push:
    tags:
      - "v*-zh"
  workflow_run:
    workflows: ["Sync upstream translations"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    # workflow_run 默认「不管上游 workflow 成功还是失败都会触发」。
    # 同步失败时 state/upstream.json 没被更新，拿它出包只会产出错误的版本号，
    # 所以在这一层显式挡掉。手动 dispatch / 推 tag 不受影响。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    # 上游要求 macOS 26 SDK，对应 Xcode 26；GitHub 的 macos-26 runner 已带
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 确认 Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      # ------------------------------------------------------------ 1. 取源码 + 打补丁
      - name: 取上游源码并打本地化补丁
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 先把仓库地址统一成「本次运行的真实仓库」。
          # set-repo.sh 是幂等的：占位符已经被替换过时它会直接提示「没发现占位符」。
          # 好处是别人 fork 之后不用改任何文件，出的包里的 Sparkle 更新源、
          # 「检查更新」菜单、一键脚本下载地址都会自动指向 fork 自己的仓库。
          if [ -n "${REPO:-}" ]; then
            bash scripts/set-repo.sh "$REPO"
          fi

          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            bash scripts/bootstrap.sh --repo "$REPO"
          else
            bash scripts/bootstrap.sh "$TAG" --repo "$REPO"
          fi

      # ------------------------------------------------------------ 2. 自检
      - name: 自检（幂等 / 语法 / 语言包 / 覆盖率）
        if: ${{ !inputs.skip_selfcheck }}
        env:
          PYTHON: python3
          MIN_COVERAGE: "85"
        run: |
          set -euo pipefail
          bash scripts/selfcheck.sh --src _upstream

      # ------------------------------------------------------------ 3. 编译打包
      - name: 编译并打包 DMG
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/build.sh

      # 编译失败时把完整 xcodebuild 日志传上来。
      # 以前只有 -quiet 且不落盘，失败时 CI 里只剩一句 exit 65，无从下手。
      - name: 失败时上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/_build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 读取版本号
        id: ver
        run: |
          set -euo pipefail
          # ls 在 dist/ 下没有匹配时会退出 2（globbing 失败），set -o pipefail 会让
          # 这条赋值整体失败，set -e 直接把这一步带走，只剩一句 ls 报错。
          # 后面还有一堆步骤依赖 dmg/version 这两个输出，所以这里明确拦住并说清楚原因。
          DMG="$(ls -1 dist/Compositor-*-zh-Hans.dmg 2>/dev/null | head -n 1 || true)"
          if [ -z "$DMG" ]; then
            echo "❗ dist/ 下没有找到 Compositor-*-zh-Hans.dmg，编译打包可能没成功。" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          VERSION="$(basename "$DMG" | sed -e 's/^Compositor-//' -e 's/-zh-Hans\.dmg$//' || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG"         >> "$GITHUB_OUTPUT"
          ls -lh dist/

      # ------------------------------------------------------------ 4. 准备一键脚本
      - name: 生成带真实仓库地址的一键脚本
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/oneclick
          # 两条替换一起上：
          #   __REPO__  —— 仓库模板里还是占位符的情况
          #   ^REPO=    —— 模板里已经写死成某个真实仓库（比如 fork 之后忘了改）的情况，
          #                直接强制覆盖成本次运行的仓库，避免出一份指向别人仓库的一键脚本
          for f in "一键安装汉化版.command" "一键恢复官方版.command"; do
            sed -e "s|__REPO__|$REPO|g" -e "s|^REPO=.*|REPO=\"$REPO\"|" "$f" > "dist/oneclick/$f"
            chmod +x "dist/oneclick/$f"
          done
          grep -n '^REPO=' dist/oneclick/*.command
          ls -l dist/oneclick/

      # ------------------------------------------------------------ 5. 上传构建产物
      - name: 上传产物（Actions artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-${{ steps.ver.outputs.version }}-zh-Hans
          path: |
            dist/*.dmg
            dist/oneclick/*.command
          retention-days: 30

      # ------------------------------------------------------------ 6. 发 Release
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          DMG: ${{ steps.ver.outputs.dmg }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-zh"

          python3 scripts/tools/make_release_notes.py --repo "$REPO" --version "$VERSION" > NOTES.md
          head -20 NOTES.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖资源。"
            gh release edit "$TAG" --title "Compositor ${VERSION} 简体中文版" --notes-file NOTES.md
            gh release upload "$TAG" "$DMG" "dist/oneclick/一键安装汉化版.command" \
              "dist/oneclick/一键恢复官方版.command" --clobber
          else
            gh release create "$TAG" \
              --title "Compositor ${VERSION} 简体中文版" \
              --notes-file NOTES.md \
              "$DMG" \
              "dist/oneclick/一键安装汉化版.command" \
              "dist/oneclick/一键恢复官方版.command"
          fi

          echo "✅ 已发布：https://github.com/$REPO/releases/tag/$TAG"

      # ------------------------------------------------------------ 7. 记录
      - name: 把出包信息写回 state
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, subprocess
          p = "state/upstream.json"
          st = json.load(open(p, encoding="utf-8"))
          tag = "v%s-zh" % os.environ["VERSION"]
          st["localized"]["last_build"] = datetime.date.today().isoformat()
          st["localized"]["release_tag"] = tag
          json.dump(st, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open(p, "a", encoding="utf-8").write("\n")
          PY

          git config user.name  "compositor-zh-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet state/upstream.json; then
            git add state/upstream.json
            git commit -m "build: 发布 v${{ steps.ver.outputs.version }}-zh"
            git push
          fi

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 出包结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${{ steps.ver.outputs.version }} |"
            echo "| DMG | ${{ steps.ver.outputs.dmg }} |"
            echo "| Release | v${{ steps.ver.outputs.version }}-zh |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
